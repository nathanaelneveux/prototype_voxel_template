[package]
name = "prototype_voxel_template"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0 OR MIT OR Apache-2.0"

[features]
default = []
dev_native = ["bevy/dynamic_linking"]

[dependencies]
avian3d = { version = "0.6", default-features = false, features = ["3d", "f32", "parry-f32", "debug-plugin"] }
bevy = { version = "0.18", features = ["file_watcher"] }
bevy_ahoy = "0.1"
bevy_asset_loader = "0.26"
bevy_common_assets = { version = "0.16", features = ["ron"] }
bevy_enhanced_input = "0.24"
bevy-inspector-egui = "0.36"
bevy_voxel_world = "0.16"
block-mesh = "0.2"
block-mesh-bgm = "0.2"
ndshape = "0.3"
noiz = "0.4"
serde = { version = "1", features = ["derive"] }

# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
