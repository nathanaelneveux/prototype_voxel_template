[package]
name = "prototype_voxel_template"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "CC0-1.0 OR MIT OR Apache-2.0"

[features]
default = ["dev_native"]
dev = [
    "bevy/dynamic_linking",
    "bevy/track_location",
]
dev_native = [
    "dev",
    "bevy/file_watcher",
]

[dependencies]
avian3d = { version = "0.8", default-features = false, features = ["3d", "parry-f32", "debug-plugin"] }
bevy = "0.20"
# Pinned until Bevy 0.20 support is released: https://github.com/janhohenheim/bevy_ahoy/pull/91
bevy_ahoy = { git = "https://github.com/valeenalabs/bevy_ahoy", rev = "4c161090e75d28d458822a65f91665f1dd94c8e6" }
bevy_asset_loader = "0.28"
bevy_common_assets = { version = "0.18", features = ["ron"] }
bevy_enhanced_input = "0.27"
bevy-inspector-egui = "0.38"
bevy_voxel_world = { version = "0.19", features = ["light_propagation"] }
block-mesh = "0.2"
block-mesh-bgm = "0.2"
ndshape = "0.3"
noiz = "0.6"
serde = { version = "1", features = ["derive"] }

# Set max log levels. This helps avoid unwanted low-severity log spam, which can affect performance.
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tracing = { version = "0.1", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Remove expensive debug assertions due to <https://github.com/bevyengine/bevy/issues/14291>
[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"
